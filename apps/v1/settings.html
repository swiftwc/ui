      document.addEventListener('click', async (evt) => {
        const menu = evt.target.closest('.custom-picker-menu')
        if (menu) {
          const slotted = menu.querySelector(':scope>[slot=label]')
          if (!slotted) return

          const btn = evt.target.closest('button[value]')
          if (!btn) return

          const clone = btn.querySelector('[data-role="check"]').nextElementSibling.cloneNode(true)
          clone.slot = 'label'
          clone.dataset.selection = btn.value

          slotted.replaceWith(clone)

          for (const el of menu.querySelectorAll(':scope>button[value]:not([slot])'))
            el.querySelector('[data-role="check"]')?.classList.toggle('invisible', el.value !== btn.value)
        }
      })
