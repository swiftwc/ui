<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="https://unpkg.com/@swiftwc/ui@canary/css" />
    <script type="module">
      import { confirmationDialog } from 'https://unpkg.com/@swiftwc/ui@canary/client'

      document.addEventListener('click', async (evt) => {
        if (!(evt.target instanceof HTMLElement)) return

        if (!evt.target.closest('button')) return

        await self.customElements.whenDefined('glass-prominent-button')

        await confirmationDialog(
          evt.target,
          'Permanently erase the items in the Trash?',
          'Are you very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very very sure?',
          [
            {
              role: 'cancel',
            },
          ]
        )
      })
    </script>
  </head>
  <body>
    <v-keyboard system-font="Inter"></v-keyboard>

    <navigation-stack>
      <scroll-view>
        <v-stack>
          <button is="glass-prominent-button" type="button" tint="red">
            <label-view title="Delete item" system-image="trash"></label-view>
          </button>
        </v-stack>
      </scroll-view>
    </navigation-stack>
  </body>
</html>
