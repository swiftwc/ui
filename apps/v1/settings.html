    <template>
      <body-view>
        <scroll-view navigation-inline-title="Energy" navigation-path="Energy">
          <v-stack placement="leading fill" frame:width="infinity" frame:max-width="40" frame:alignment="center">
            <list-view list-style="inset-grouped" class="[--list-row-gap:1rem]">
              <section-view>
                <toggle-view label="Low Power Mode"></toggle-view>
              </section-view>
              <section-view>
                <toggle-view is-on label="Prevent automatic sleeping when the display is off"></toggle-view>
                <toggle-view>
                  <label-view slot="label" title="Wake for network access"></label-view>
                  <label-view
                    slot="label"
                    title="White sleeping, your device can receive incoming network traffic, such as messages and other updates."
                  ></label-view>
                </toggle-view>
              </section-view>
              <section-view>
                <labeled-content labeled-content-style="horizontal">
                  <label-view slot="label" title="Start up when power is connected"></label-view>
                  <label-view slot="label" title="Stay off until the power button is pressed."></label-view>
                  <picker-view selection="Never" picker-style="menu">
                    <option slot="list" value="Never"></option>
                    <option slot="list" value="After power failure"></option>
                    <option slot="list" value="Always"></option>
                  </picker-view>
                </labeled-content>
              </section-view>
            </list-view>
          </v-stack>
        </scroll-view>
        <tool-bar>
          <tool-bar-item slot="top-bar-leading">
            <button type="button" tabindex="0" class="back">
              <label-view system-image="caret-left"></label-view>
            </button>
          </tool-bar-item>
        </tool-bar>
      </body-view>
    </template>
