<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!-- Order matters MUST come first -->
    <style>
      @layer base, sw, components, utilities, theme;
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/@swiftwc/ui@canary/css" />
    <script type="module" src="https://unpkg.com/@swiftwc/ui@canary/client"></script>
    <script type="module" src="main.mjs"></script>
  </head>
  <body>
    <v-keyboard system-font="Inter"></v-keyboard>

    <navigation-stack>
      <scroll-view>
        <v-stack placement="leading fill">
          <list-view>
            <labeled-content label="Spacing" labeled-content-style="horizontal">
              <input class="inline-[200px] m-0" type="range" value="-10" step="10" min="-10" max="50" list="Spacing" />
              <datalist id="Spacing">
                <option>-10</option>
                <option>0</option>
                <option>10</option>
                <option>20</option>
                <option>30</option>
                <option>40</option>
                <option>50</option>
              </datalist>
              <div class="flex justify-between inline-[200px]">
                <label-view font="caption2" title="Off"></label-view>
                <label-view class="me-auto ms-[20px]" font="caption2" title="0"></label-view>
                <label-view font="caption2" title="50"></label-view>
              </div>
            </labeled-content>
            <labeled-content labeled-content-style="horizontal">
              <label-view slot="label" title="Distribution"></label-view>
              <label-view slot="label">
                <span>The default value is &quot;<span class="font-mono">safe center</span>&quot;</span>
              </label-view>
              <picker-view selection="Off" picker-style="menu" foreground="primary">
                <option slot="list">Off</option>
                <option slot="list" label="Leading">leading</option>
                <option slot="list" label="Center">center</option>
                <option slot="list" label="Trailing">trailing</option>
                <option slot="list" label="Fill">fill</option>
                <option slot="list" label="Space between">space-between</option>
              </picker-view>
            </labeled-content>
            <labeled-content labeled-content-style="horizontal">
              <label-view slot="label" title="Alignment"></label-view>
              <label-view slot="label">
                <span>The default value is &quot;<span class="font-mono">safe center</span>&quot;</span>
              </label-view>
              <picker-view selection="Off" picker-style="menu" foreground="primary">
                <option slot="list">Off</option>
                <option slot="list" label="Leading">leading</option>
                <option slot="list" label="Center">center</option>
                <option slot="list" label="Trailing">trailing</option>
                <option slot="list" label="Fill">fill</option>
              </picker-view>
            </labeled-content>
          </list-view>
          <label-view font="headline" title="Example:" class="my-3 text-center" padding></label-view>
          <v-stack id="demo" class="outline-yellow-500 outline-4 inline-90 block-40 max-inline-[80vw] justify-self-center relative">
            <span class="absolute inset-[-18px_auto_auto_-4px] text-[10px] font-mono text-[#767676] truncate mix-blend-plus-darker"
              >&lt;v-stack<span id="spacing"></span><span id="distribution"></span><span id="alignment"></span>&gt;</span
            >
            <span class="absolute inset-[-5px_auto_auto_-14px] text-[10px] font-mono text-[#767676] truncate mix-blend-plus-darker">↓</span>
            <label-view font="title3" class="border-dashed border-2 border-blue-500 p-1 z-1 mix-blend-plus-darker relative">
              <span>Rachael Chiseck</span>
            </label-view>
            <label-view font="caption2" foreground="secondary" class="border-dashed border-2 border-blue-500 z-1 p-1 mix-blend-plus-darker relative">
              <span>CEO</span>
            </label-view>
          </v-stack>
        </v-stack>
      </scroll-view>
    </navigation-stack>
  </body>
</html>
